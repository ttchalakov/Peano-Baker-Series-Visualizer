<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Peano-Baker Series Visualizer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.54.0/build/stlite.css" />
</head>

<body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.54.0/build/stlite.js"></script>
    <script>
        stlite.mount({
            requirements: ["numpy", "scipy", "sympy", "plotly"],
            entrypoint: "app.py",
            files: {
                "app.py": {
                    url: "./app.py",
                },
                "utils.py": {
                    url: "./utils.py",
                },
                "case_studies.py": {
                    url: "./case_studies.py",
                },
            },
            pageTitle: "Peano-Baker Series Visualizer",
        }, document.getElementById("root"));
    </script>
</body>

</html>
